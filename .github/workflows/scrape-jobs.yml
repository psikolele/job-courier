# RETIRED — kept for reference only, no longer scheduled.
#
# This scraped jobroom's old `latest-and-all-job-ads.php` into a JSON file on the
# `data` branch. Nothing reads that file any more: the site serves jobs live from
# `webapp/api/jobs.js` (Arca24 via `webapp/api/_arca24.js`), and `webapp/vercel.json`
# already disables deployments for the `data` branch.
#
# Meanwhile the scraped page now answers a 718-byte stub — it needs the session
# cookie warm-up that `_arca24.js` does and this script never did — so every hourly
# run exited 1 on "Nessun job estratto" and mailed a failure notice. The cron is
# gone; `workflow_dispatch` stays so the job can still be run by hand if the old
# path is ever needed.
name: Hourly Job Scraper

on:
  workflow_dispatch: # Solo avvio manuale

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        working-directory: ./scripts
        run: npm install

      - name: 🕷️ Run Puppeteer Scraper
        working-directory: ./scripts
        run: node scrape.js

      - name: 🚀 Deploy JSON to data branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: data
          force_orphan: false # mantieni history leggera se preferisci, o usa branch root veri
          commit_message: "chore: update latest_jobs.json [skip ci]"
