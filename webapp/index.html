<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- data-framework="TCFv2.2" makes Cookiebot the site's IAB TCF consent
         provider (CMP id 134). The attribute name is stale on Cookiebot's side:
         it emits TCF 2.3, which IAB has required for new consent signals since
         28.02.2026. Without it the TC string that advertisers read comes from
         Google's own GDPR message instead, which is why the site used to show
         two consent banners. -->
    <script id="Cookiebot" src="https://consent.cookiebot.com/uc.js" data-cbid="29601bde-40d6-45d8-be15-4b7bdef2d50c" data-blockingmode="auto" data-framework="TCFv2.2" type="text/javascript"></script>

    <!-- Must run before any Google tag, and must NOT be consent-gated: it only
         tells Google's tags to read consent from the TCF string rather than
         assume it. -->
    <script>window['gtag_enable_tcf_support'] = true;</script>

    <!-- Google Analytics (GA4) — same property as jobroom.jobcourier.ch, so
         traffic across both hosts lands in one dataset. Gated on Cookiebot's
         "statistics" consent category via type="text/plain": Cookiebot only
         rewrites the type to text/javascript and runs it after the visitor
         opts in, so no analytics fires pre-consent. -->
    <script type="text/plain" data-cookieconsent="statistics" async src="https://www.googletagmanager.com/gtag/js?id=G-06VZ8XHHPH"></script>
    <script type="text/plain" data-cookieconsent="statistics">
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-06VZ8XHHPH');
    </script>

    <!-- Google AdSense — publisher pub-4406252930350703, the same account the
         previous WordPress site used (Auto ads: no manual <ins> slots, Google
         picks the placements). Gated on Cookiebot's "marketing" category with
         the same type="text/plain" pattern as GA4 above, so nothing is
         requested from pagead2.googlesyndication.com before the visitor opts
         in. The matching seller line lives in public/ads.txt. -->
    <script type="text/plain" data-cookieconsent="marketing" async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4406252930350703" crossorigin="anonymous"></script>

    <link rel="icon" type="image/svg+xml" href="/logo-square.svg" />
    <link rel="icon" type="image/png" href="/logo-square.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO & Localization -->
    <title>JobCourier - Il portale svizzero per il lavoro</title>

    <!-- Open Graph / Facebook -->
    <!-- The generic fallback, and the only one a client that does not run JavaScript
         sees — every social scraper included. For /offerta and /azienda the SSR
         functions rewrite these per page before serving (api/_ssr.js). Once the app
         boots, main.jsx removes this set and the page's own Helmet takes over, so
         nothing ends up with two of anything. Keep the title and these four tags in
         sync as a pair: main.jsx removes exactly `head > title` and `og:*`. -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="JobCourier - Il portale svizzero per il lavoro">
    <meta property="og:description" content="Il portale leader in Svizzera per connettere i migliori talenti con le aziende di successo. Cerca migliaia di offerte di lavoro in tutti i settori.">
    <meta property="og:image" content="https://www.jobcourier.ch/logo-square.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap" rel="stylesheet">
    
    <!-- JSON-LD Structured Data Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "JobCourier",
      "url": "/",
      "description": "Il portale svizzero per il lavoro e il recruiting.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
